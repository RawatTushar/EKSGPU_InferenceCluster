apiVersion: v1
kind: Service
metadata:
  name: triton
  namespace: default
  labels:
    app: triton
spec:
  selector:
    app: triton

  ports:
    - name: http
      port: 8000
      targetPort: http

    - name: grpc
      port: 8001
      targetPort: grpc

    - name: metrics
      port: 8002
      targetPort: metrics

  type: ClusterIP