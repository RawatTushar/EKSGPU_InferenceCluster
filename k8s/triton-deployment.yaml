apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  namespace: inference

spec:
  replicas: 1

  selector:
    matchLabels:
      app: triton

  template:
    metadata:
      labels:
        app: triton

    spec:
      serviceAccountName: triton

      nodeSelector:
        workload: gpu

      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule

      volumes:
        - name: models
          emptyDir: {}

      initContainers:
        - name: download-models
          image: amazon/aws-cli:latest

          command:
            - /bin/sh
            - -c
            - |
              aws s3 cp s3://triton-models-tushar312002/ /models/ --recursive

          volumeMounts:
            - name: models
              mountPath: /models

      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:26.08-py3

          command:
            - tritonserver
            - --model-repository=/models
            - --model-control-mode=none

          resources:
            limits:
              nvidia.com/gpu: 1

          ports:
            - containerPort: 8000
              name: http

            - containerPort: 8001
              name: grpc

            - containerPort: 8002
              name: metrics

          startupProbe:
            httpGet:
              path: /v2/health/ready
              port: 8000
            failureThreshold: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8000
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: 8000
            periodSeconds: 10

          volumeMounts:
            - name: models
              mountPath: /models