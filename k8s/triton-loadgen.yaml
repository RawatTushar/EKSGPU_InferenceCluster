apiVersion: v1
kind: Pod
metadata:
  name: triton-loadgen
  namespace: inference
spec:
  restartPolicy: Never
  containers:
    - name: loadgen
      image: python:3.11-slim
      command:
        - /bin/bash
        - -c
        - |
          pip install --no-cache-dir "tritonclient[http]" numpy
          sleep 3600
